name: ds-v4pilot
description: |
  v4 Phase 2 PILOT QA gate (v4 plan §8): one short mixed run exercising the new
  cross-backend traffic library (schedules + shared size prior + load-matching
  mixer), BOTH classes launched from the same keepalive sidecar. Role-swapped so
  each UE attacks in exactly half of its active phases (the C1-confound fix,
  previewed at pilot scale). Covers pacer/hping/iperf and the two §6.3 benign
  hard-negative counterparts (tcp_shortconn vs SYN, dns_client vs UDP-small).
  Attacker and its benign counterpart in each phase carry the SAME mean load
  (volume cannot separate them). Detection OFF. Purpose: confirm achieved_ok >=90%,
  schedules realised, 0 causality violations before the full campaign.
ues: {ue1: attacker, ue2: benign}
reps: 1
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 300}
tail_s: 12
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle, duration: 15}
  # pacer, fGn self-similar schedule: ue1 attacks, ue2 legitimate heavy upload, matched 0.8 Mbit/s
  - {name: p-fgn,  duration: 30, attack: true, victim_mode: silent, flows: {
        ue1: {ul: {v4: true, backend: pacer, model: fgn, level_mbps: 0.8, role: attack, seed: 11}},
        ue2: {ul: {v4: true, backend: pacer, model: fgn, level_mbps: 0.8, role: benign, seed: 12}}}}
  - {name: gap1, duration: 8}
  # hping3 UDP: role-swapped (ue2 attacks), MMPP-2 bursty schedule, matched 0.8 Mbit/s
  - {name: p-hping, duration: 30, attack: true, victim_mode: responsive, flows: {
        ue1: {ul: {v4: true, backend: hping, mode: udp, model: cbr,   level_mbps: 0.8, role: benign, seed: 21}},
        ue2: {ul: {v4: true, backend: hping, mode: udp, model: mmpp2, level_mbps: 0.8, role: attack, seed: 22}}}}
  - {name: gap2, duration: 8}
  # iperf2 UDP: ue1 attacks (on-off Pareto), ue2 legitimate CBR, same tool both sides
  - {name: p-iperf, duration: 30, attack: true, victim_mode: silent, flows: {
        ue1: {ul: {v4: true, backend: iperf, model: onoff_pareto, level_mbps: 0.8, role: attack, seed: 31}},
        ue2: {ul: {v4: true, backend: iperf, model: cbr,          level_mbps: 0.8, role: benign, seed: 32}}}}
  - {name: gap3, duration: 8}
  # SYN flood (ue2, Hawkes) vs the benign short-connection hard-negative (ue1, Hawkes), matched level
  - {name: p-syn, duration: 30, attack: true, victim_mode: responsive, flows: {
        ue1: {ul: {v4: true, backend: tcp_shortconn, model: hawkes, level_mbps: 0.2, role: benign, seed: 41}},
        ue2: {ul: {v4: true, backend: hping, mode: syn, model: hawkes, level_mbps: 0.2, role: attack, seed: 42}}}}
  - {name: gap4, duration: 8}
  # UDP small-packet flood (ue1, 64 B, pulsing) vs benign DNS client hard-negative (ue2)
  - {name: p-dns, duration: 30, attack: true, victim_mode: silent, flows: {
        ue1: {ul: {v4: true, backend: pacer, model: pulsing, level_mbps: 0.4, role: attack, seed: 51, size_alpha: 0.2}},
        ue2: {ul: {v4: true, backend: dns_client, model: poisson, level_mbps: 0.2, role: benign, seed: 52}}}}
report: [benign_delivered_ratio_baseline]
