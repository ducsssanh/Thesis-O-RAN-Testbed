name: ingest-two-sources
description: |
  Data path check (~7 min): the xApp receives KPM (gNB, E2) and URR (eBPF
  UPF, PFCP -> SMF -> producer -> A1-EI -> adapter) for each SUPI, every
  second, complete and bound to the right UE, through an idle period, UL and
  DL traffic, swapped rates and a UE re-attach. Detection off (no action
  shapes the traffic); the xApp still builds the feature vectors. The two
  UEs send 4x apart so a swapped SUPI binding shows as a ~4x volume error.
  Grade: python3 scripts/k8s/exp/ingest_check.py <campaign dir>
ues: {ue1: benign, ue2: benign}
reps: 1
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 300}
tail_s: 12                     # URR reaches the xApp up to ~8 s after the traffic
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle, duration: 30}
  # UL total 3.75 Mbit/s: below the RFsim UL capacity (3.8-6.2), so the OAI
  # UE does not buffer and the next phase starts clean
  - {name: ul-4x, duration: 60, baseline: true, flows: {ue1: {ul: 3M}, ue2: {ul: 750k}}}
  - {name: dl-4x, duration: 60, flows: {ue1: {dl: 6M}, ue2: {dl: 1500k}}}
  - {name: ul-swapped, duration: 40, flows: {ue1: {ul: 750k}, ue2: {ul: 3M}}}
  # UE2 re-attaches (new UE ID, new PDU session); the xApp is restarted after
  # it, as in operation (KPM UE list, docs/SESSION-HANDOFF.md section 6)
  - {name: reconnect, duration: 60, action: {restart_ue: ue2, restart_xapp: true},
     flows: {ue1: {ul: 750k}, ue2: {ul: 2M}}}
report: [benign_max_level, benign_delivered_ratio_baseline]
