name: ds-benign-bulk
description: |
  Dataset v1 BENIGN session: legitimate heavy uploads with LARGE packets --
  sustained UDP bulk and a real TCP transfer (handshake + MSS-sized segments).
  The TCP phase is the protocol control for the SYN flood (normal, low SYN rate).
  Two load levels (500k, 1200k) so benign spans the same byte-rate band as the
  floods. Detection OFF so nothing shapes the traffic. ue1 is the subject; ue2
  is a steady benign background for cell context. Independent sessions = reps.
ues: {ue1: benign, ue2: benign}
reps: 6
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 300}
tail_s: 12
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle,         duration: 15}
  - {name: udp-lg-lo,    duration: 30, flows: {ue1: {ul: {rate: 500k,  pkt: 1400}}, ue2: {ul: 400k}}}
  - {name: gap1,         duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: udp-lg-hi,    duration: 30, flows: {ue1: {ul: {rate: 1200k, pkt: 1400}}, ue2: {ul: 400k}}}
  - {name: gap2,         duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: tcp-bulk,     duration: 30, flows: {ue1: {ul: {rate: 1200k, pkt: 1400, proto: tcp}}, ue2: {ul: 400k}}}
report: [benign_delivered_ratio_baseline]
