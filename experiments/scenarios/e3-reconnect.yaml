name: e3-reconnect
description: |
  E3 - attacker that reconnects. UE1 floods until it reaches level 3 (or the
  phase ends), then re-attaches (new PDU session, new UE ID) and floods again.
  Compares no defense, RAN layer only and both layers. Shortened ladder
  (20/30/240/240 s, probation 120 s) so that level 3 is reachable in one run;
  report the timing with the results.
ues: {ue1: attacker, ue2: benign}
reps: 5
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 420}
defense_common:
  classes: {ue1: default, ue2: default}
  timing: {expiryS: [20, 30, 240, 240], probationS: 120, fusionS: 10}
variants:
  - name: no-defense
    defense: {enabled: false}
  - name: ran-only
    defense: {enabled: true, core: false, mode: slice}
  - name: two-layer
    defense: {enabled: true, core: true, mode: slice}
phases:
  - {name: baseline, duration: 20, baseline: true, flows: {ue1: {ul: 1M}, ue2: {ul: 1M}}}
  - name: attack
    duration: 420             # upper bound; a run usually reaches level 3 in 90-250 s (single-layer repeats stop at 2)
    attack: true
    flows: {ue1: {ul: 10M}, ue2: {ul: 1M}}
    stop_when: {ue: ue1, level_gte: 3, hold_s: 15}
  - name: reconnect
    reconnect: true
    action: {restart_ue: ue1, restart_xapp: true}
    duration: 60
    flows: {ue1: {ul: 10M}, ue2: {ul: 1M}}
  - {name: cooldown, duration: 20, flows: {ue2: {ul: 1M}}}
report: [attacker_t_level1_s, attacker_t_level3_s, attacker_t_upf_block_s, attacker_max_level,
         attacker_delivered_ratio_attack, attacker_dn_ul_mbps_attack, attacker_dn_ul_mbps_after_reconnect,
         attacker_dn_ul_mbytes_after_reconnect, attacker_upf_drop_ul_mbytes, benign_delivered_ratio_attack,
         benign_loss_pct_attack, benign_max_level]
