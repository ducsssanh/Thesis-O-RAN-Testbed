name: ds-flood-proto
description: |
  Dataset v1 MALICIOUS session: protocol floods (SYN, ICMP, DNS) load-matched to
  the benign band (500k/1200k). Each has a benign protocol control in
  ds-benign-* (TCP bulk for SYN; icmp-ping for ICMP; dns-query for DNS), so the
  detector must key on the abnormal RATE/pattern, not the protocol's presence.
  Detection OFF. ue1 attacker, ue2 benign background.
ues: {ue1: attacker, ue2: benign}
reps: 6
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 300}
tail_s: 12
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle,      duration: 15}
  - {name: syn-lo,    duration: 30, attack: true, flows: {ue1: {ul: {attack: syn_flood,  rate: 500k}},  ue2: {ul: 400k}}}
  - {name: gap1,      duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: syn-hi,    duration: 30, attack: true, flows: {ue1: {ul: {attack: syn_flood,  rate: 1200k}}, ue2: {ul: 400k}}}
  - {name: gap2,      duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: icmp-lo,   duration: 30, attack: true, flows: {ue1: {ul: {attack: icmp_flood, rate: 500k}},  ue2: {ul: 400k}}}
  - {name: gap3,      duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: icmp-hi,   duration: 30, attack: true, flows: {ue1: {ul: {attack: icmp_flood, rate: 1200k}}, ue2: {ul: 400k}}}
  - {name: gap4,      duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: dns-lo,    duration: 30, attack: true, flows: {ue1: {ul: {attack: dns_flood,  rate: 500k}},  ue2: {ul: 400k}}}
  - {name: gap5,      duration: 12, flows: {ue2: {ul: 400k}}}
  - {name: dns-hi,    duration: 30, attack: true, flows: {ue1: {ul: {attack: dns_flood,  rate: 1200k}}, ue2: {ul: 400k}}}
report: [benign_delivered_ratio_baseline]
