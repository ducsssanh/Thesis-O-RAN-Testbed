name: ds-flood-twin-pilot
description: |
  Attacks L1-L3 laid over the benign twin (TRAFFIC-TWINNING-PLAN 5.1-5.3, 3.3). Each phase is one real 75 s P4 window on each UE;
  the attacker UE also runs the attack flow, roles swap between phases, rates anchored to the q0.90 / q0.95 / q0.99 active-second UL rate.
  Pilot for step 4: achieved rate, shape at the UPF against 5G-NIDD, c_t at the attack onset. Ramp and react variants are not here. Detection off.
ues: {ue1: benign, ue2: benign}
reps: 1
drain: {quiet_kbps: 300, timeout_s: 120}
tail_s: 5
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle, duration: 10}
  - {name: a01, duration: 75, attack: true, flows: {
        ue1: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51001}, ul_attack: {v4: true, evasion: L1, mode: udp, band: P4, timing: tti, anchor_bps: 111088.0, role: attack, seed: 61000, victim_mode: silent}},
        ue2: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51002}}}}
  - {name: a02, duration: 75, attack: true, flows: {
        ue1: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51011}},
        ue2: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51012}, ul_attack: {v4: true, evasion: L1, mode: syn, band: P4, timing: tti, anchor_bps: 111088.0, role: attack, seed: 61001, victim_mode: responsive}}}}
  - {name: a03, duration: 75, attack: true, flows: {
        ue1: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51021}, ul_attack: {v4: true, evasion: L1, mode: icmp, band: P4, timing: tti, anchor_bps: 111088.0, role: attack, seed: 61002, victim_mode: responsive}},
        ue2: {ul: {v4: true, model: real_window, backend: pacer, band: P4, grid: gnb, timing: tti, role: benign, seed: 51022}}}}
