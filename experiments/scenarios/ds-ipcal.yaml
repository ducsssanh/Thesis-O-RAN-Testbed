name: ds-ipcal
description: iperf CBR achieved calibration (post header-fix) at L1/L2/L3 — decides iperf keep/drop.
ues: {ue1: attacker, ue2: benign}
reps: 1
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 300}
tail_s: 12
variants: [{name: detection-off, defense: {enabled: false, core: false}}]
phases:
  - {name: idle, duration: 12}
  - {name: ip-l1, duration: 30, flows: {ue1: {ul: {v4: true, backend: iperf, model: cbr, level_mbps: 0.4, role: benign, seed: 201}}}}
  - {name: g1, duration: 8}
  - {name: ip-l2, duration: 30, flows: {ue1: {ul: {v4: true, backend: iperf, model: cbr, level_mbps: 0.8, role: benign, seed: 202}}}}
  - {name: g2, duration: 8}
  - {name: ip-l3, duration: 30, flows: {ue1: {ul: {v4: true, backend: iperf, model: cbr, level_mbps: 1.2, role: benign, seed: 203}}}}
