name: e1-ran-layer
description: |
  E1 - RAN layer alone against an uplink flood. UE1 floods 10 Mbit/s UL,
  UE2 sends 1 Mbit/s. Compares no defense (control, measured in every rep)
  with the RAN layer in slice mode and in per-UE quota mode. Real lab timing.
ues: {ue1: attacker, ue2: benign}
reps: 5
payload_bytes: 1200
drain: {quiet_kbps: 300, timeout_s: 420}
defense_common:
  classes: {ue1: default, ue2: default}
  timing: {expiryS: [60, 180, 600, 0], probationS: 180, fusionS: 10}
variants:
  - name: no-defense
    defense: {enabled: false}
  - name: ran-slice
    defense: {enabled: true, core: false, mode: slice}
  - name: ran-ue-quota
    defense: {enabled: true, core: false, mode: ue}
phases:
  - {name: baseline, duration: 30, baseline: true, flows: {ue1: {ul: 1M}, ue2: {ul: 1M}}}
  - {name: attack, duration: 90, attack: true, flows: {ue1: {ul: 10M}, ue2: {ul: 1M}}}
  - {name: after, duration: 30, flows: {ue2: {ul: 1M}}}
report: [attacker_t_first_evidence_s, attacker_t_level1_s, attacker_t_ran_limit_s, attacker_max_level,
         attacker_delivered_ratio_attack, attacker_dn_ul_mbps_attack, benign_delivered_ratio_baseline,
         benign_delivered_ratio_attack, benign_loss_pct_attack, benign_max_level]
