name: ds-heldout-twin-P3
description: |
  Benign twin validation, band P3 (TRAFFIC-TWINNING-PLAN §6): 5 reps x 10 phases x 2 UEs = 100 real 75 s windows, each rep with
  its own windows (run.py adds the rep to the seed). `grid: gnb` keeps each sent second inside one gNB stats second.
  Compare with research/twinning/validate_twin.py. Needs the long keep-alive and T2 of deploy/k8s/values/minikube.yaml. Detection off.
ues: {ue1: benign, ue2: benign}
reps: 5
drain: {quiet_kbps: 300, timeout_s: 120}
tail_s: 5
variants:
  - name: detection-off
    defense: {enabled: false, core: false}
phases:
  - {name: idle, duration: 10}
  - {name: w01, duration: 75, flows: {
        ue1: {ul: {v4: true, model: real_window, backend: pacer, band: P3, grid: gnb, timing: tti, windows_npz: research/twinning/heldout_windows.npz, tti_npz: research/twinning/heldout_windows_tti.npz, role: benign, seed: 31001}},
        ue2: {ul: {v4: true, model: real_window, backend: pacer, band: P3, grid: gnb, timing: tti, windows_npz: research/twinning/heldout_windows.npz, tti_npz: research/twinning/heldout_windows_tti.npz, role: benign, seed: 32001}}}}
