apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-amf
  labels: {oai-lab/component: "amf"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-amf
      app.kubernetes.io/instance: oai-lab
  template:
    metadata:
      labels:
        oai-lab/component: "amf"
        app.kubernetes.io/name: oai-amf
        app.kubernetes.io/instance: oai-lab
      annotations:
        oai-lab/config-checksum: "2c53c4d784a6271f420a4a481ea18df05a25dc366a813699b2651b6804f3dbb8"
        k8s.v1.cni.cncf.io/networks: "[{\"interface\":\"n2\",\"name\":\"oai-amf-n2\"}]"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: prepare
          image: "oai-lab-tools:unbuilt"
          command: [python3, /opt/lab/runtime.py, prepare, "amf"]
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: oai-lab-credentials, key: DB_PASSWORD}}
          securityContext:
            privileged: false
            capabilities: {add: [NET_ADMIN], drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /input, readOnly: true}
            - {name: runtime, mountPath: /config}
      containers:
        - name: amf
          image: "oaisoftwarealliance/oai-amf:v2.2.0"
          imagePullPolicy: IfNotPresent
          command: ["/openair-amf/bin/oai_amf", -c, /config/config.yaml, -o]
          securityContext:
            privileged: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests: {"cpu":"100m","memory":"256Mi"}
            limits: {"cpu":"2","memory":"1Gi"}
          startupProbe:
            exec: {command: [sh, -c, "awk '$2 ~ /:0050$/ && $4 == \"0A\" {ok=1} END {exit !ok}' /proc/net/tcp /proc/net/tcp6"]}
            failureThreshold: 90
            periodSeconds: 2
          readinessProbe:
            exec: {command: [sh, -c, "awk '$2 ~ /:0050$/ && $4 == \"0A\" {ok=1} END {exit !ok}' /proc/net/tcp /proc/net/tcp6"]}
            periodSeconds: 5
          volumeMounts:
            - {name: runtime, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: oai-lab-config}
        - name: runtime
          emptyDir: {medium: Memory}
