      mcc: "001"
      mnc: "01"
    profile: oai-lab
    radio:
      band: 78
      frequency: 3619200000
      numerology: 1
      prbs: 106
    secretName: oai-lab-credentials
    slice:
      dnn: nist-dnn
      sd: FFFFFF
      sst: 1
    tac: 7
    toolsImage: oai-lab-tools:f4aafed83d8c25ea
    ueSubnet: 10.1.0.0/16
    usageReporting: true
    workloads:
      amf:
        image: oaisoftwarealliance/oai-amf:v2.2.0
        limits:
          cpu: "2"
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
