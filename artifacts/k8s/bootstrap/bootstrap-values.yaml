    cpus: 8
    dbImage: mariadb:10.6
    dbSize: 2Gi
    experiment:
      duration: 120
      periodMs: 1000
      rate: 10M
      timeout: 180
    kubernetesVersion: v1.33.13
    memoryMiB: 16384
    minDiskGiB: 25
    minRetainedDiskGiB: 5
    namespace: oai-lab
    networks:
      e2:
        addresses:
          flexric: 172.30.27.10
          gnb: 172.30.27.20
          xapp: 172.30.27.30
        bridge: oai-e2
        subnet: 172.30.27.0/24
      n2:
        addresses:
          amf: 172.30.22.10
          gnb: 172.30.22.20
        bridge: oai-n2
        subnet: 172.30.22.0/24
      n3:
        addresses:
          gnb: 172.30.23.20
          upf: 172.30.23.10
        bridge: oai-n3
        subnet: 172.30.23.0/24
      n4:
