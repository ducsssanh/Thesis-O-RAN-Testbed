# Source: oai-lab/templates/db.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: oai-lab-db}
spec:
  serviceName: oai-lab-db
  replicas: 1
  selector:
    matchLabels: {oai-lab/component: db}
  template:
    metadata:
      labels: {oai-lab/component: db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: db
          image: "mariadb:10.6"
          env:
            - {name: MARIADB_DATABASE, value: oai_db}
            - {name: MARIADB_USER, value: oai}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: oai-lab-credentials, key: DB_PASSWORD}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: oai-lab-credentials, key: DB_ROOT_PASSWORD}}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
          startupProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: oai-lab-db}
