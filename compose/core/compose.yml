    volumes:
      - read_only: true
        source: ./cp-cfg/config.yaml
        target: /openair-ausf/etc/config.yaml
        type: bind
  bridge:
    annotations:
      5gdeploy.every_host: '1'
    cap_add:
      - NET_ADMIN
    command:
      - /bin/ash
      - /action.sh
    container_name: bridge
    depends_on: {}
    devices: []
    entrypoint: []
    environment:
      HTTPS_PROXY: ''
      HTTP_PROXY: ''
      http_proxy: ''
      https_proxy: ''
    extra_hosts: {}
    healthcheck:
      interval: 31s
      start_period: 30s
      test:
        - CMD
        - test
        - '-f'
        - /run/5gdeploy-bridge-is-healthy
    image: 5gdeploy.localhost/bridge
    init: true
    network_mode: host
    networks: {}
    ports: []
    stop_signal: SIGTERM
    sysctls: {}
    volumes:
      - read_only: true
        source: bridge.sh
        target: /action.sh
        type: bind
  cpufreq:
    annotations:
      5gdeploy.every_host: '1'
    cap_add: []
    command:
      - /bin/ash
      - '-c'
      - |-
        set -euo pipefail
        msg() { echo -ne "\e[35m[5gdeploy] \e[94m"; echo -n "$$*"; echo -e "\e[0m"; }
        die() { msg "$$*"; exit 1; }
        with_retry() { while ! "$$@"; do sleep 0.2; done }
        CLEANUPS='set -euo pipefail'
        cleanup() { msg Performing cleanup; ash -c "$$CLEANUPS"; trap - EXIT SIGTERM; }
        trap cleanup EXIT SIGTERM

        if [[ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]]; then
          msg Setting CPUFreq governor
          echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
        else
          msg Unable to set CPUFreq governor
        fi

        msg Idling
        tail -f &
        wait $$!
    container_name: cpufreq
    depends_on: {}
    devices: []
    entrypoint: []
    environment:
      HTTPS_PROXY: ''
      HTTP_PROXY: ''
      http_proxy: ''
      https_proxy: ''
    extra_hosts: {}
    hostname: cpufreq
    image: alpine:3.21
    init: true
    network_mode: none
    networks: {}
    ports: []
    privileged: true
    stop_signal: SIGTERM
    sysctls:
      net.ipv4.conf.all.arp_filter: 1
      net.ipv4.conf.all.forwarding: 0
      net.ipv4.conf.all.rp_filter: 2
      net.ipv4.conf.default.rp_filter: 2
      net.ipv6.conf.all.forwarding: 0
      net.ipv6.conf.default.disable_ipv6: 1
    volumes: []
  dn_internet:
    annotations:
      5gdeploy.cpus: '1'
      5gdeploy.dn: 01FFFFFF_nist-dnn
      5gdeploy.ip_mgmt: 172.25.160.2
      5gdeploy.ip_n6: 172.25.161.2
    cap_add:
      - NET_ADMIN
    command:
      - /bin/ash
      - '-c'
      - |-
        set -euo pipefail
        msg() { echo -ne "\e[35m[5gdeploy] \e[94m"; echo -n "$$*"; echo -e "\e[0m"; }
        die() { msg "$$*"; exit 1; }
        with_retry() { while ! "$$@"; do sleep 0.2; done }
        IFNAME=$$(ip -o addr show to 172.25.160.2 | awk '{ print $$2 }')
        if [[ -z $$IFNAME ]]; then
          msg Waiting for netif mgmt to appear
          with_retry ip link show dev mgmt &>/dev/null
          NETIF_WAITED=1
        elif [[ $$IFNAME != mgmt ]]; then
          die Found 172.25.160.2 on $$IFNAME instead of mgmt
        fi
        msg Disabling TX checksum offload on mgmt
        ethtool --offload mgmt tx off || msg Cannot disable offload on mgmt, outgoing packets may get dropped
        IFNAME=$$(ip -o addr show to 172.25.161.2 | awk '{ print $$2 }')
        if [[ -z $$IFNAME ]]; then
          msg Waiting for netif n6 to appear
          with_retry ip link show dev n6 &>/dev/null
          NETIF_WAITED=1
        elif [[ $$IFNAME != n6 ]]; then
          die Found 172.25.161.2 on $$IFNAME instead of n6
        fi
        msg Disabling TX checksum offload on n6
        ethtool --offload n6 tx off || msg Cannot disable offload on n6, outgoing packets may get dropped
        unset IFNAME
        sleep $${NETIF_WAITED:-0}
        msg Listing IP addresses
        ip addr list up
        msg All netifs are ready
        msg Adding routes for 01FFFFFF:nist-dnn toward UPFs
        ip route replace 10.1.0.0/16 via 172.25.161.21 metric 1
        msg Listing IP routes
        ip route list table all type unicast
        exec tail -f
    container_name: dn_internet
    depends_on: {}
    devices: []
    entrypoint: []
    environment:
      HTTPS_PROXY: ''
      HTTP_PROXY: ''
      http_proxy: ''
      https_proxy: ''
    extra_hosts: {}
    hostname: dn_internet
    image: 5gdeploy.localhost/dn
    init: true
    networks:
