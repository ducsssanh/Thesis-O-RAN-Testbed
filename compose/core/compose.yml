        driver_opts:
          com.docker.network.endpoint.ifname: mgmt
        ipv4_address: 172.25.160.2
        mac_address: 52:de:ac:19:a0:02
      n6:
        driver_opts:
          com.docker.network.endpoint.ifname: n6
        ipv4_address: 172.25.161.2
        mac_address: 52:de:ac:19:a1:02
    ports: []
    stop_signal: SIGTERM
    sysctls:
