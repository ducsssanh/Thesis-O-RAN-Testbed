services:
  amf:
    annotations:
      5gdeploy.ip_cp: 172.25.162.11
      5gdeploy.ip_db: 172.25.165.11
      5gdeploy.ip_n2: 192.168.62.11
    cap_add:
      - NET_ADMIN
    command:
      - /bin/bash
      - '-c'
      - |-
        set -euo pipefail
        msg() { echo -ne "\e[35m[5gdeploy] \e[94m"; echo -n "$$*"; echo -e "\e[0m"; }
        die() { msg "$$*"; exit 1; }
        with_retry() { while ! "$$@"; do sleep 0.2; done }
        msg Listing IP addresses
        ip addr list up || /usr/sbin/ifconfig || true
        msg Starting oai_amf
        exec ./bin/oai_amf -c ./etc/config.yaml -o
    container_name: amf
    depends_on: {}
    devices: []
    entrypoint: []
    environment:
      HTTPS_PROXY: ''
      HTTP_PROXY: ''
      http_proxy: ''
      https_proxy: ''
    extra_hosts: {}
    hostname: amf
    image: oaisoftwarealliance/oai-amf:v2.2.0
    init: true
    networks:
      cp:
        driver_opts:
          com.docker.network.endpoint.ifname: cp
        ipv4_address: 172.25.162.11
        mac_address: 52:de:ac:19:a2:0b
      db:
        driver_opts:
          com.docker.network.endpoint.ifname: db
        ipv4_address: 172.25.165.11
        mac_address: 52:de:ac:19:a5:0b
      n2:
        driver_opts:
          com.docker.network.endpoint.ifname: n2
        ipv4_address: 192.168.62.11
        mac_address: 52:de:c0:a8:3e:0b
    ports: []
    stop_signal: SIGQUIT
    sysctls:
      net.ipv4.conf.all.arp_filter: 1
      net.ipv4.conf.all.forwarding: 0
      net.ipv4.conf.all.rp_filter: 2
      net.ipv4.conf.default.rp_filter: 2
      net.ipv6.conf.all.forwarding: 0
      net.ipv6.conf.default.disable_ipv6: 1
    volumes:
      - read_only: true
        source: ./cp-cfg/config.yaml
        target: /openair-amf/etc/config.yaml
        type: bind
  ausf:
    annotations:
      5gdeploy.ip_cp: 172.25.162.12
      5gdeploy.ip_db: 172.25.165.12
