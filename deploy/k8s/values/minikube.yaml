      ausf:
        image: oaisoftwarealliance/oai-ausf:v2.2.0
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '2'
          memory: 1Gi
      amf:
        image: oaisoftwarealliance/oai-amf:v2.2.0
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '2'
          memory: 1Gi
      smf:
        image: oaisoftwarealliance/oai-smf:v2.2.0
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '2'
          memory: 1Gi
      upf:
        image: oai-lab-upf:unbuilt
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '2'
          memory: 1Gi
      flexric:
        image: oai-lab-flexric:unbuilt
        requests:
          cpu: 100m
