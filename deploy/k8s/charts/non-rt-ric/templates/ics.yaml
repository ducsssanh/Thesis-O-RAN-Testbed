apiVersion: v1
kind: ServiceAccount
metadata: {name: non-rt-ric}
---
apiVersion: v1
kind: Service
metadata: {name: informationservice}
spec:
  selector: {app.kubernetes.io/name: informationservice}
  ports: [{name: https, port: 9083, targetPort: 8434}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: informationservice-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.ics.size }}}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: informationservice-config}
data:
  application.yml: |
    spring:
      profiles: {active: prod}
    server:
      port: 8434
      http-port: 8083
      ssl:
        key-store-type: JKS
        key-store: /opt/app/information-coordinator-service/etc/cert/keystore.jks
        key-alias: informationservice
    app:
      filepath: /opt/app/information-coordinator-service/data/application_configuration.json
      webclient:
        trust-store-used: true
        trust-store: /opt/app/information-coordinator-service/etc/cert/truststore.jks
      vardata-directory: /var/information-coordinator-service
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: informationservice}
spec:
  serviceName: informationservice
  replicas: {{ .Values.ics.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: informationservice}}
  template:
    metadata: {labels: {app.kubernetes.io/name: informationservice}}
    spec:
      serviceAccountName: non-rt-ric
      automountServiceAccountToken: false
      initContainers:
        - name: data-permissions
          image: {{ .Values.global.lab.toolsImage | quote }}
          command: [sh, -ec, 'mkdir -p /var/information-coordinator-service/database; chown -R 999:1000 /var/information-coordinator-service']
          volumeMounts: [{name: data, mountPath: /var/information-coordinator-service}]
      containers:
        - name: ics
          image: {{ .Values.ics.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8434}]
          env:
            - name: SERVER_SSL_KEY_STORE_PASSWORD
              valueFrom: {secretKeyRef: {name: informationservice-tls, key: store-password}}
            - name: SERVER_SSL_KEY_PASSWORD
              valueFrom: {secretKeyRef: {name: informationservice-tls, key: store-password}}
            - name: APP_WEBCLIENT_TRUST_STORE_PASSWORD
              valueFrom: {secretKeyRef: {name: informationservice-tls, key: store-password}}
          startupProbe: {tcpSocket: {port: 8434}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: 8434}, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: '1', memory: 1Gi}}
          volumeMounts:
            - {name: config, mountPath: /opt/app/information-coordinator-service/config/application.yml, subPath: application.yml, readOnly: true}
            - {name: tls, mountPath: /opt/app/information-coordinator-service/etc/cert, readOnly: true}
            - {name: data, mountPath: /var/information-coordinator-service}
      volumes:
        - {name: config, configMap: {name: informationservice-config}}
        - {name: tls, secret: {secretName: informationservice-tls}}
        - {name: data, persistentVolumeClaim: {claimName: informationservice-data}}
