apiVersion: v1
kind: Service
metadata: {name: urr-ei-producer}
spec:
  selector: {app.kubernetes.io/name: urr-ei-producer}
  ports: [{name: https, port: 8443, targetPort: 8443}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urr-ei-producer-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.producer.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: urr-ei-producer}
spec:
  replicas: {{ .Values.producer.replicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: urr-ei-producer}}
  template:
    metadata: {labels: {app.kubernetes.io/name: urr-ei-producer}}
    spec:
      serviceAccountName: non-rt-ric
      automountServiceAccountToken: true
      securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: producer
          image: {{ .Values.producer.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: ICS_URL, value: 'https://informationservice.non-rt-ric.svc.cluster.local:9083'}
            - {name: SMF_URL, value: 'http://oai-smf.oai-core.svc.cluster.local:80'}
            - {name: PUBLIC_URL, value: 'https://urr-ei-producer.non-rt-ric.svc.cluster.local:8443'}
            - {name: DNN, value: {{ .Values.global.lab.slice.dnn | quote }}}
            - {name: SST, value: {{ .Values.global.lab.slice.sst | quote }}}
            - {name: SD, value: {{ .Values.global.lab.slice.sd | quote }}}
            - name: SUPI
              valueFrom: {secretKeyRef: {name: {{ .Values.global.lab.secretName }}, key: SUPI}}
          startupProbe: {httpGet: {scheme: HTTPS, path: /healthz, port: 8443}, periodSeconds: 5, failureThreshold: 20}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: 8443}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: data, mountPath: /var/lib/urr-ei}
        - name: artifacts
          image: {{ .Values.global.lab.toolsImage | quote }}
          command: [sleep, infinity]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/urr-ei, readOnly: true}]
      volumes:
        - {name: tls, secret: {secretName: urr-ei-producer-tls}}
        - {name: ca, secret: {secretName: oai-lab-ca}}
        - {name: data, persistentVolumeClaim: {claimName: urr-ei-producer-data}}
