apiVersion: v1
kind: ServiceAccount
metadata: {name: near-rt-ric}
---
apiVersion: v1
kind: Service
metadata: {name: a1-ei-adapter}
spec:
  selector: {app.kubernetes.io/name: a1-ei-adapter}
  ports: [{name: https, port: 8443, targetPort: 8443}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a1-ei-adapter-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oai-lab-artifacts
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.global.lab.artifactSize }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: a1-ei-adapter}
spec:
  replicas: {{ .Values.adapter.replicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: a1-ei-adapter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: a1-ei-adapter}}
    spec:
      serviceAccountName: near-rt-ric
      automountServiceAccountToken: false
      securityContext: {runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: adapter
          image: {{ .Values.adapter.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: ICS_URL, value: 'https://informationservice.non-rt-ric.svc.cluster.local:9083'}
            - {name: PUBLIC_URL, value: 'https://a1-ei-adapter.near-rt-ric.svc.cluster.local:8443'}
            {{- if .Values.adapter.xappPushEnabled }}
            - {name: XAPP_URL, value: 'https://oai-lab-xapp.near-rt-ric.svc.cluster.local:8443'}
            {{- end }}
            - {name: DNN, value: {{ .Values.global.lab.slice.dnn | quote }}}
            - {name: SST, value: {{ .Values.global.lab.slice.sst | quote }}}
            - {name: SD, value: {{ .Values.global.lab.slice.sd | quote }}}
            # EI job SUPI filter; empty = every UE of the slice (R1, several UEs)
            {{- if .Values.adapter.allUes }}
            - {name: SUPI, value: ""}
            {{- else }}
            - name: SUPI
              valueFrom: {secretKeyRef: {name: {{ .Values.global.lab.secretName }}, key: SUPI}}
            {{- end }}
          startupProbe: {httpGet: {scheme: HTTPS, path: /healthz, port: 8443}, periodSeconds: 5, failureThreshold: 20}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: 8443}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: data, mountPath: /var/lib/a1-ei}
        - name: artifacts
          image: {{ .Values.global.lab.toolsImage | quote }}
          command: [sleep, infinity]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/a1-ei, readOnly: true}]
      volumes:
        - {name: tls, secret: {secretName: a1-ei-adapter-tls}}
        - {name: ca, secret: {secretName: oai-lab-ca}}
        - {name: data, persistentVolumeClaim: {claimName: a1-ei-adapter-data}}
